<!DOCTYPE html>
<html lang="fr">
<head>

    <title>MR VISUALS — Photographe en Vendée</title>
    <meta name="robots" content="noindex">
    <meta name="theme-color" content="#080808">
    <style>
        html, body { height: 100%; margin: 0; }
        body { display: grid; place-items: center; background: #080808; color: #f1ede6; font-family: Georgia, "Times New Roman", serif; text-align: center; padding: 24px; }
        p { margin: 0 0 14px; font-size: 1.05rem; letter-spacing: 0.04em; color: #a9a9a9; }
        a { color: #b8945a; text-decoration: none; border-bottom: 1px solid #7a5f33; padding-bottom: 2px; font-size: 1.25rem; letter-spacing: 0.08em; }
    </style>
    <script>
        // Une adresse de l'ancien domaine (ex. /golf.html) mène à la même page sur mrvisuals.fr
        location.replace('https://mrvisuals.fr' + location.pathname + location.search + location.hash);
    </script>
</head>
<body>
    <main>
        <p>Le site de MR VISUALS a une nouvelle adresse :</p>
        <a href="https://mrvisuals.fr/">mrvisuals.fr</a>
